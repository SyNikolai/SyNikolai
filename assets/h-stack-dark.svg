<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
<style>
.u{stroke-dasharray:120;stroke-dashoffset:120;animation:d 1s ease-out .3s forwards}
@keyframes d{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
<text x="120" y="38" text-anchor="middle" font-family="Georgia, Cambria, Times New Roman, serif" font-style="italic" font-size="34" fill="#e6edf3">stack</text>
<line class="u" x1="60" y1="52" x2="180" y2="52" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
</svg>
